apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: testing-hpa1
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: test-deployment
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 61
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 54
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: testtimebasedhpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: test-deployment
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 50
